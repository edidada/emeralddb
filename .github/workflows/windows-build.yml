name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2022, 2025 and the current latest image
        os: [windows-2022, windows-2025, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # The code uses boost::xtime / Spirit Classic, which were removed in
      # newer Boost releases, so a Boost 1.49.0 source tree is required.
      - name: Download Boost 1.49.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.49.0/source/boost_1_49_0.7z" -OutFile boost.7z
          & "C:\Program Files\7-Zip\7z.exe" x boost.7z -y | Out-Null
          Move-Item -Path boost_1_49_0 -Destination boost

          # Boost 1.49 names the clock enum TIME_UTC, which collides with the
          # TIME_UTC macro from the current Windows SDK. The project expects
          # the historical TIME_UTC_ spelling, so rename it in the header.
          $xtime = "boost/boost/thread/xtime.hpp"
          $text = Get-Content -Path $xtime -Raw
          $text = $text.Replace("TIME_UTC=1", "TIME_UTC_=1")
          $text = $text.Replace("clock_type == TIME_UTC", "clock_type == TIME_UTC_")
          Set-Content -Path $xtime -Value $text -NoNewline

      - name: Build Boost libraries
        shell: cmd
        run: |
          cd boost
          call bootstrap.bat msvc
          b2 --with-thread --with-program_options --with-date_time --with-system link=static runtime-link=static threading=multi variant=debug toolset=msvc stage

      # Boost 1.49 auto-link expects the vc110 library names; newer toolsets
      # produce a different toolset tag, so mirror the libs under that name.
      - name: Normalize Boost library names
        shell: pwsh
        run: |
          Get-ChildItem boost\stage\lib\*.lib | ForEach-Object {
            $name = $_.BaseName -replace 'vc\d+', 'vc110'
            if (-not $name.StartsWith('lib')) { $name = 'lib' + $name }
            $target = Join-Path $_.DirectoryName ($name + '.lib')
            if ($target -ne $_.FullName) { Copy-Item $_.FullName $target -Force }
          }

      - name: Build solution
        shell: cmd
        run: |
          set LINK=/LIBPATH:%GITHUB_WORKSPACE%\boost\stage\lib
          msbuild emeralddb.sln /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=v143 /m /verbosity:minimal
